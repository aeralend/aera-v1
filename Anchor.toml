[toolchain]
package_manager = "npm"
# Pinned to the Agave line Cookie Chain reports from getVersion (solana-core 4.1.2).
solana_version = "3.1.8"

[features]
resolution = true
skip-lint = false

# Cookie Chain is an SVM L1 with its own genesis
# (9wDaBRDgArEUpvhHxGguNkwozsZh4UpGZB9o2EoEcBB2), so it is not one of Anchor's
# named clusters. It is declared under [programs.localnet] because that is the
# key Anchor reads when `provider.cluster` is a bare URL.
[programs.localnet]
aera = "AerafpFHsY4N16i4KufPJQyURryxKtYgCr6oZMwbp76q"

[provider]
cluster = "https://rpc.cookiescan.io"
wallet = "~/.config/solana/id.json"

[scripts]
# Tests are Rust + LiteSVM, run by cargo.
test = "cargo test"
